services:
  - type: web
    name: driverflow-api
    runtime: node
    plan: free
    buildCommand: PUPPETEER_CACHE_DIR=/opt/render/project/src/.cache/puppeteer npm install && PUPPETEER_CACHE_DIR=/opt/render/project/src/.cache/puppeteer npx puppeteer browsers install chrome
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      - key: DATABASE_URL
        fromDatabase:
          name: driverflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RUN_MIGRATIONS
        value: "false"
      - key: PORT
        value: "10000"
      - key: ALLOWED_ORIGINS
        value: "*" # Update this with your final app domain or *

  - type: worker
    name: driverflow-worker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: driverflow-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RUN_MIGRATIONS
        value: "false"

databases:
  - name: driverflow-db
    plan: free
